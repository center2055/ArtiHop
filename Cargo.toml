[package]
name = "artihop"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Standalone local SOCKS proxy powered by Arti"
repository = "https://github.com/center2055/ArtiHop"

[dependencies]
anyhow = "=1.0.104"
futures = { version = "=0.3.34", default-features = false, features = ["std"] }
arti-client = { version = "=0.48.0", default-features = false, features = ["tokio", "rustls", "compression", "static-sqlite", "bridge-client", "pt-client", "onion-service-client", "geoip"] }
clap = { version = "=4.6.8", features = ["derive"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
toml = "=1.2.1"
tor-socksproto = "=0.48.0"
tor-circmgr = { version = "=0.48.0", default-features = false }
tor-rtcompat = { version = "=0.48.0", default-features = false, features = ["tokio", "rustls"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }

[patch.crates-io]
tor-circmgr = { path = "vendor/tor-circmgr" }

# A proxy spends its life copying bytes and doing crypto: optimise across crates, keep one codegen
# unit for better inlining, and drop debug symbols from the shipped binary.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
